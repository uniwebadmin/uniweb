# One-off diagnostic: find the correct Hostinger FTP base path for uniweb.co.in.
#
# Investigation concluded 2026-07-22 (see _inbox/PHOTO_NOTES.md "Deploy fix"
# section for full writeup). Summary: the new dedicated FTP sub-account
# (u806999427.uniwebdeploy) uploads succeed (FTP 226) and its own FTP LIST
# correctly shows the uploaded files (including pre-existing site files like
# index.php/demo.php/customer_login.php AND our newly-uploaded files) sitting
# in what hPanel calls the real docroot — but anything written through this
# sub-account (new files AND edits to existing files) never becomes visible
# over HTTPS, on either resolved IP, with or without cache-busting, even for
# a zero-dependency plain-text PHP file. Pre-existing content (uploaded via
# the OLD/main FTP account historically) continues to serve fine from the
# exact same directory. This points to the sub-account's writes not reaching
# whatever filesystem the live web server actually reads from (a hosting/
# hPanel-side account-scoping issue), not a wrong path — needs the owner's
# hPanel access to resolve further (see PHOTO_NOTES.md for exact next steps).
#
# This job just deletes the throwaway probe/marker files this investigation
# left on the account. Keep this workflow (workflow_dispatch only) in case a
# future session with Actions-dispatch permission needs to re-probe.
name: FTP base-path probe (diagnostic)

on:
  workflow_dispatch:

jobs:
  cleanup:
    name: Delete stray probe/marker files left on the account during investigation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete _ftpprobe_* and _diag_probe.php
        env:
          HOST: ${{ secrets.UNIWEB_FTP_HOST }}
          USER: ${{ secrets.UNIWEB_FTP_USER }}
          PASS: ${{ secrets.UNIWEB_FTP_PASS }}
        run: |
          set -uo pipefail
          USER_ENC=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['USER'], safe=''))")
          PASS_ENC=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['PASS'], safe=''))")
          set +e
          root_url="ftp://${USER_ENC}:${PASS_ENC}@${HOST}/"
          for f in _ftpprobe_root.php _ftpprobe_publichtml.php _ftpprobe_domainspublichtml.php _ftpprobe_httpdocs.php _ftpprobe_www.php _diag_probe.php; do
            out=$(curl -sS --ftp-pasv --connect-timeout 20 --max-time 30 -Q "DELE ${f}" "$root_url" 2>&1)
            code=$?
            echo "DELE $f -> exit=$code out='$out'"
          done
          set -e

  list:
    name: List FTP directories to find the real docroot (re-run if needed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Print login PWD (true FTP home, no guessing)
        env:
          HOST: ${{ secrets.UNIWEB_FTP_HOST }}
          USER: ${{ secrets.UNIWEB_FTP_USER }}
          PASS: ${{ secrets.UNIWEB_FTP_PASS }}
        run: |
          set -uo pipefail
          USER_ENC=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['USER'], safe=''))")
          PASS_ENC=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['PASS'], safe=''))")
          url="ftp://${USER_ENC}:${PASS_ENC}@${HOST}/"
          echo "=== PWD (raw curl verbose, look for '257' line) ==="
          curl -sS --ftp-pasv --connect-timeout 20 --max-time 30 -Q "PWD" "$url" -v 2>&1 | grep -E "^< 257|^< 530|Connected to|^< 220|^< 230" || true
          echo "=== SYST (server type) ==="
          curl -sS --ftp-pasv --connect-timeout 20 --max-time 30 -Q "SYST" "$url" -v 2>&1 | grep -E "^< 215" || true

      - name: List candidate directories over FTP
        env:
          HOST: ${{ secrets.UNIWEB_FTP_HOST }}
          USER: ${{ secrets.UNIWEB_FTP_USER }}
          PASS: ${{ secrets.UNIWEB_FTP_PASS }}
        run: |
          set -uo pipefail
          USER_ENC=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['USER'], safe=''))")
          PASS_ENC=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['PASS'], safe=''))")

          list_dir() {
            label="$1"
            path="$2"
            url="ftp://${USER_ENC}:${PASS_ENC}@${HOST}/${path}"
            echo "=== LIST [$label] path='$path' ==="
            out=$(curl -sS --ftp-pasv --connect-timeout 20 --max-time 30 -l "$url" 2>&1)
            code=$?
            if [ $code -ne 0 ]; then
              echo "(curl exit=$code — likely does not exist or no access)"
            else
              nfiles=$(echo "$out" | wc -l)
              echo "(...$nfiles entries total)"
              echo "--- key markers ---"
              for key in "index.php" "config.php" ".htaccess" "includes" "assets" "migrations"; do
                if echo "$out" | grep -qiFx "$key"; then
                  echo "  [FOUND]   $key"
                else
                  echo "  [MISSING] $key"
                fi
              done
            fi
            echo
          }

          list_dir "home (.)" ""
          for d in public_html domains "domains/uniweb.co.in" "domains/uniweb.co.in/public_html" "domains/uniweb.co.in/public_html/public_html" httpdocs www; do
            list_dir "$d" "$d"
          done

          echo "=== FULL NAMES: home (.) ==="
          curl -sS --ftp-pasv --connect-timeout 20 --max-time 30 -l "ftp://${USER_ENC}:${PASS_ENC}@${HOST}/" 2>&1
          echo
          echo "=== FULL NAMES: domains/ ==="
          curl -sS --ftp-pasv --connect-timeout 20 --max-time 30 -l "ftp://${USER_ENC}:${PASS_ENC}@${HOST}/domains/" 2>&1
          echo
          echo "=== FULL NAMES: public_html/ ==="
          curl -sS --ftp-pasv --connect-timeout 20 --max-time 30 -l "ftp://${USER_ENC}:${PASS_ENC}@${HOST}/public_html/" 2>&1
          echo
          echo "=== FULL NAMES: domains/uniweb.co.in/ ==="
          curl -sS --ftp-pasv --connect-timeout 20 --max-time 30 -l "ftp://${USER_ENC}:${PASS_ENC}@${HOST}/domains/uniweb.co.in/" 2>&1
          echo
          echo "=== FULL NAMES: domains/uniweb.co.in/public_html/ ==="
          curl -sS --ftp-pasv --connect-timeout 20 --max-time 30 -l "ftp://${USER_ENC}:${PASS_ENC}@${HOST}/domains/uniweb.co.in/public_html/" 2>&1
          echo
          echo "=== FULL NAMES: domains/uniweb.co.in/public_html/public_html/ ==="
          curl -sS --ftp-pasv --connect-timeout 20 --max-time 30 -l "ftp://${USER_ENC}:${PASS_ENC}@${HOST}/domains/uniweb.co.in/public_html/public_html/" 2>&1
