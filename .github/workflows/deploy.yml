# UniWeb — Hostinger FTP auto-deploy (laptop-free)
#
# Triggers on every push to `main` (and manual workflow_dispatch).
# Secrets: UNIWEB_FTP_HOST, UNIWEB_FTP_USER, UNIWEB_FTP_PASS
# Optional: UNIWEB_FTP_REMOTE (defaults to public_html)
#
# Uses parallel FTP curl (same transport as scripts/release_deploy.ps1).
# Git-ignored config.php / .vscode/sftp.json are never in checkout.

name: Deploy to UniWeb Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: uniweb-live-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: FTP upload to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload tracked files via FTP (parallel)
        env:
          HOST: ${{ secrets.UNIWEB_FTP_HOST }}
          USER: ${{ secrets.UNIWEB_FTP_USER }}
          PASS: ${{ secrets.UNIWEB_FTP_PASS }}
          REMOTE: ${{ secrets.UNIWEB_FTP_REMOTE }}
        run: |
          set -euo pipefail
          if [ -z "${HOST:-}" ] || [ -z "${USER:-}" ] || [ -z "${PASS:-}" ]; then
            echo "Missing required UNIWEB_FTP_* secrets."
            exit 1
          fi
          BASE="${REMOTE:-public_html}"
          BASE="${BASE#/}"
          case "$BASE" in
            home/*/domains/*/public_html*|*/public_html) BASE="public_html" ;;
            public_html*) ;;
            *) BASE="public_html" ;;
          esac
          export HOST BASE
          export USER_ENC PASS_ENC
          USER_ENC=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['USER'], safe=''))")
          PASS_ENC=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['PASS'], safe=''))")

          mapfile -t FILES < <(git ls-files | grep -vE '^(tests/|\.github/|\.vscode/|_inbox/|.*\.md$)' || true)
          echo "Uploading ${#FILES[@]} files to ftp://${HOST}/${BASE}/ (parallel=8)"

          upload_one() {
            rel="$1"
            [ -f "$rel" ] || return 0
            remote="${BASE}/${rel}"
            code=$(curl -sS --ftp-pasv --ftp-create-dirs \
              --connect-timeout 15 --max-time 90 \
              -T "$rel" \
              "ftp://${USER_ENC}:${PASS_ENC}@${HOST}/${remote}" \
              -w "%{http_code}" -o /dev/null) || code="000"
            if [ "$code" != "226" ] && [ "$code" != "250" ]; then
              echo "FAIL $rel (curl=$code)"
              return 1
            fi
            return 0
          }
          export -f upload_one

          printf '%s\n' "${FILES[@]}" | xargs -P 8 -I{} bash -c 'upload_one "$@"' _ {}
          echo "Upload OK: ${#FILES[@]} files"

      - name: Optional live smoke (non-blocking)
        continue-on-error: true
        run: |
          curl -fsS -o /dev/null -w "homepage %{http_code}\n" "https://uniweb.co.in/" || true
          curl -fsS -o /dev/null -w "login %{http_code}\n" "https://uniweb.co.in/login.php" || true
          curl -fsS -o /dev/null -w "customer_login %{http_code}\n" "https://uniweb.co.in/customer_login.php" || true
