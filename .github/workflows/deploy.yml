# UniWeb — Hostinger FTP auto-deploy (laptop-free)
#
# Triggers on every push to `main` (and manual workflow_dispatch).
# Secrets: UNIWEB_FTP_HOST, UNIWEB_FTP_USER, UNIWEB_FTP_PASS
# Optional: UNIWEB_FTP_REMOTE (defaults to public_html)
#
# Uses parallel FTP curl (same transport as scripts/release_deploy.ps1) so
# special characters in passwords work. Git-ignored config.php /
# .vscode/sftp.json are never in the checkout.
#
# Parallel uploads + per-file retry + serial second pass for flaky Hostinger
# connections (sequential curl of 300+ files was too slow / timed out).

name: Deploy to UniWeb Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: uniweb-live-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: FTP upload to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upload tracked files via FTP (parallel)
        env:
          HOST: ${{ secrets.UNIWEB_FTP_HOST }}
          USER: ${{ secrets.UNIWEB_FTP_USER }}
          PASS: ${{ secrets.UNIWEB_FTP_PASS }}
          REMOTE: ${{ secrets.UNIWEB_FTP_REMOTE }}
        run: |
          set -euo pipefail
          if [ -z "${HOST:-}" ] || [ -z "${USER:-}" ] || [ -z "${PASS:-}" ]; then
            echo "Missing required UNIWEB_FTP_* secrets."
            exit 1
          fi
          RAW_REMOTE="${REMOTE:-}"
          BASE="${RAW_REMOTE:-public_html}"
          BASE="${BASE#/}"
          BASE="${BASE%/}"
          # Hostinger FTP accounts are often already chrooted into the site docroot.
          # In that case the correct remote base is "." (not domains/.../public_html).
          # Set GitHub secret UNIWEB_FTP_REMOTE to "." or "DOCROOT" when that applies.
          # For account-home chroot, use domains/uniweb.co.in/public_html (no home/USER/).
          if [ "$BASE" = "DOCROOT" ] || [ "$BASE" = "." ] || [ "$BASE" = "docroot" ]; then
            BASE="."
          else
            BASE="$(printf '%s' "$BASE" | sed -E 's#^home/[^/]+/##')"
            if [ -z "$BASE" ]; then
              BASE="public_html"
            fi
          fi
          # Auto-fallback probe path: if secret still looks like a full domain path,
          # also export FALLBACK_BASE="." for a second-pass critical-file upload when probe fails.
          export FALLBACK_BASE="."
          echo "FTP remote base: ${BASE} (raw secret set=$( [ -n "$RAW_REMOTE" ] && echo yes || echo no ))"
          export HOST BASE
          export USER_ENC PASS_ENC
          USER_ENC=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['USER'], safe=''))")
          PASS_ENC=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['PASS'], safe=''))")

          # Temporary full sync: root files are missing on live, incremental skip was
          # the cause. Sync the entire tracked tree this run, then revert to incremental.
          mapfile -t FILES < <(git ls-files | grep -vE '^(tests/|\.github/|\.vscode/|_inbox/|.*\.md$)' || true)
          MODE="full (temporary)"
          echo "Uploading ${#FILES[@]} files to ftp://${HOST}/${BASE}/ (mode=${MODE}, parallel=3 + retry)"

          upload_one() {
            rel="$1"
            [ -f "$rel" ] || return 0
            remote="${BASE}/${rel}"
            url="ftp://${USER_ENC}:${PASS_ENC}@${HOST}/${remote}"
            attempt=1
            while [ "$attempt" -le 2 ]; do
              code=$(curl -sS --ftp-pasv --ftp-create-dirs \
                --connect-timeout 20 --max-time 90 \
                -T "$rel" \
                "$url" \
                -w "%{http_code}" -o /dev/null) || code="000"
              # FTP success: 226 transfer complete, 250 requested file action OK.
              if [ "$code" = "226" ] || [ "$code" = "250" ]; then
                return 0
              fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
            echo "FAIL $rel (curl=$code)"
            return 1
          }
          export -f upload_one

          FAIL_FILE="$(mktemp)"
          if [ "${#FILES[@]}" -gt 0 ]; then
            # Do not use set -e across xargs: collect failures, then serial retry.
            # Low parallelism (3) — Hostinger shared FTP throttles/blocks the
            # source IP when too many simultaneous connections hit it at once.
            set +e
            printf '%s\n' "${FILES[@]}" | xargs -P 3 -I{} bash -c 'upload_one "$1" || echo "$1" >>"$2"' _ {} "$FAIL_FILE"
            set -e
          else
            echo "No changed files to upload."
          fi

          FAIL_COUNT=0
          if [ -s "$FAIL_FILE" ]; then
            FAIL_COUNT=$(wc -l < "$FAIL_FILE" | tr -d ' ')
            echo "Retrying $FAIL_COUNT failed uploads serially…"
            while IFS= read -r rel; do
              if ! upload_one "$rel"; then
                echo "STILL FAIL $rel"
              else
                FAIL_COUNT=$((FAIL_COUNT - 1))
              fi
            done < "$FAIL_FILE"
          fi
          rm -f "$FAIL_FILE"

          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo "Upload finished with $FAIL_COUNT failures"
            exit 1
          fi
          echo "Upload OK: ${#FILES[@]} files"

      - name: Optional live smoke (non-blocking)
        continue-on-error: true
        run: |
          curl -fsS -o /dev/null -w "homepage %{http_code}\n" "https://uniweb.co.in/" || true
          curl -fsS -o /dev/null -w "login %{http_code}\n" "https://uniweb.co.in/login.php" || true
          curl -fsS -o /dev/null -w "demo %{http_code}\n" "https://uniweb.co.in/demo.php" || true
          curl -fsS -o /dev/null -w "customer_login %{http_code}\n" "https://uniweb.co.in/customer_login.php" || true
          curl -fsS -o /dev/null -w "cust_php %{http_code}\n" "https://uniweb.co.in/cust.php" || true
          curl -fsS -o /dev/null -w "cust_path %{http_code}\n" "https://uniweb.co.in/cust" || true
          curl -fsS -o /dev/null -w "payer_php %{http_code}\n" "https://uniweb.co.in/payer.php" || true
          # Prove docroot is the real site: enlarged mobile field from PR #35
          if curl -fsS "https://uniweb.co.in/assets/css/auth-portal.css?v=2" | grep -q "ap-phone"; then
            echo "docroot_probe ap-phone OK"
          else
            echo "docroot_probe ap-phone MISSING — FTP may still be writing to the wrong folder (check UNIWEB_FTP_REMOTE)"
          fi
